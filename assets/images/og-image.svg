<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2B4F"/>
      <stop offset="100%" stop-color="#4A1A8A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C4DBB"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative cross -->
  <text x="80" y="120" font-family="serif" font-size="90" fill="#7C4DBB" opacity="0.3">+</text>
  <!-- Glow circles -->
  <circle cx="1000" cy="100" r="300" fill="#7C4DBB" opacity="0.08"/>
  <circle cx="200" cy="500" r="250" fill="#7C4DBB" opacity="0.06"/>
  <!-- Brand name -->
  <text x="120" y="240" font-family="Arial, sans-serif" font-size="32" fill="#F0F4F8" font-weight="300" letter-spacing="1">Unmeasurable Heights of Strength</text>
  <text x="120" y="295" font-family="Arial, sans-serif" font-size="52" fill="#FFFFFF" font-weight="700" letter-spacing="0.5">Healthcare Services</text>
  <!-- Tagline -->
  <text x="120" y="360" font-family="Arial, sans-serif" font-size="22" fill="#C4B5FD" font-weight="400">Rising Above. Empowering Wellness. Serving Our Community.</text>
  <!-- Divider -->
  <rect x="120" y="400" width="100" height="4" rx="2" fill="url(#accent)"/>
  <!-- Provider name -->
  <text x="120" y="450" font-family="Arial, sans-serif" font-size="18" fill="#9CA3AF" font-weight="400">Provider: Nacole Brown, MSN, AGPCNP-BC</text>
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#0B2B4F" opacity="0.5"/>
  <text x="120" y="612" font-family="Arial, sans-serif" font-size="15" fill="#6B7280">© 2026 UHS Healthcare — Compassionate, Patient-Centered Care</text>
</svg>
