name: CI/CD - UHS Healthcare

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm run install:backend

      - name: Install CSS linter
        run: npm install -g stylelint stylelint-config-standard

      - name: Lint JavaScript
        run: npx eslint js/ backend/ --ext .js --max-warnings 0

      - name: Lint CSS
        run: stylelint "css/*.css" "patient/css/*.css" --config .stylelintrc.json

      - name: Lint HTML
        run: |
          for f in *.html patient/*.html; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              grep -q '<!DOCTYPE html>' "$f" || { echo "Missing DOCTYPE in $f"; exit 1; }
              grep -q 'lang="en"' "$f" || { echo "Missing lang attribute in $f"; exit 1; }
              grep -q '<meta charset="UTF-8">' "$f" || { echo "Missing charset in $f"; exit 1; }
              grep -q '<meta name="viewport"' "$f" || { echo "Missing viewport in $f"; exit 1; }
            fi
          done

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uhs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm run install:backend

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uhs_test
          JWT_SECRET: test_jwt_secret_for_testing_only_32chars!!
          COOKIE_SECRET: test_cookie_secret_for_testing_only_32c!
          NODE_ENV: test
          FRONTEND_URL: http://localhost:3000
        run: cd backend && npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}