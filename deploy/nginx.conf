# ============================================
# UHS Healthcare — Nginx Production Config
# Deploy to /etc/nginx/sites-available/uhs
# ============================================

upstream uhs_api {
  least_conn;
  server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
}

# Redirect www to non-www (choose one)
server {
  listen 80;
  server_name www.uhshealthcare.com;
  return 301 https://uhshealthcare.com$request_uri;
}

# HTTPS — main server block
server {
  listen 443 ssl http2;
  server_name uhshealthcare.com;

  # SSL — Let's Encrypt (install via certbot)
  ssl_certificate     /etc/letsencrypt/live/uhshealthcare.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/uhshealthcare.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/uhshealthcare.com/chain.pem;

  # Modern TLS config
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS (uncomment after verifying HTTPS works)
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "0" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Root directory (frontend static files)
  root /var/www/uhshealthcare;
  index index.html;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

  # Brotli (if module is installed)
  # brotli on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

  # Cache static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /css/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /js/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Admin dashboard (served by backend static)
  location /admin/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # API proxy
  location /api/ {
    proxy_pass http://uhs_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # SPA fallback — serve index.html for unknown routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Deny hidden files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Robots
  location = /robots.txt {
    access_log off;
    log_not_found off;
  }

  # Deny access to Node.js files
  location ~* \.(?:env|lock|log)$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  access_log /var/log/nginx/uhs-access.log;
  error_log  /var/log/nginx/uhs-error.log warn;
}

# HTTP -> HTTPS redirect
server {
  listen 80;
  server_name uhshealthcare.com;
  return 301 https://$server_name$request_uri;
}
